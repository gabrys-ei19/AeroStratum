# Mob Grinding Utils Configuration

[general]
	# Allows grinder crafting
	enableGrindersEasy = false
	
	# Grinder processing speed
	grinderSpeed = 1.0

[mobs]
	# Drop multiplier from grinding
	dropMultiplier = 1.5
	
	# XP multiplier
	xpMultiplier = 1.0

[advanced]
	# Enables advanced grinding features
	enableAdvancedGrinding = true
	
	# Socket enchantments on grinders
	enableSocketing = true
