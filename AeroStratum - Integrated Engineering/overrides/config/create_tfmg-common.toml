# Create: The Factory Must Grow Configuration

[industrial]
	# Enables TFMG features
	enableTFMG = true

[recipes]
	# Allow diesel fuel crafting
	allowDieselCrafting = true
	
	# Allow steel smelting
	allowSteelSmelting = true

[refinery]
	# Refinery processing speed
	refinerySpeed = 1.0
	
	# Maximum heat for distillation
	maxHeat = 500

[machinery]
	# Industrial machine efficiency
	machineEfficiency = 1.0
	
	# Enables heavy machinery crafting
	enableHeavyMachinery = true
